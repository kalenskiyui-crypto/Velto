<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Rent a Tesla by the day or month across Europe. Charging included, booked in minutes.">

<body>
<div id="app"></div>
<template id="vl-tpl">
<div style="background: #ffffff">
  <div ref="{{setPre}}" class="vl-pre" role="status" aria-live="polite" style="position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #ffffff; color: #121212; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">

      </div>
    </div>
    <p ref="{{setPreLabel}}" style="margin: 0; font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #5f6366">Charging</p>
  </div>
  <header class="{{headerClass}}" style="position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding: 22px 32px; color: #121212; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
    <a href="#" class="vl-logo" aria-label="Velto home" style="grid-column: 1; justify-self: start; display: flex; align-items: center; color: #121212; text-decoration: none">

    </a>
    <nav class="ohm-nav" aria-label="Main" style="grid-column: 2; justify-self: center">
      <ul style="display: flex; gap: 28px; list-style: none; margin: 0; padding: 0">
        <li><a href="#what-we-do" style="color: #121212; text-decoration: none; font-size: 15px">What we do</a></li>
        <li><a href="#services" style="color: #121212; text-decoration: none; font-size: 15px">Services</a></li>
        <li><a href="#video" style="color: #121212; text-decoration: none; font-size: 15px">Get 20% off</a></li>
        <li><a href="#fleet" style="color: #121212; text-decoration: none; font-size: 15px">Our fleet</a></li>
      </ul>
    </nav>
    <div style="grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 14px">
      <div class="vl-loc">
        <button type="button" class="vl-loc-btn" aria-haspopup="listbox" aria-expanded="{{locOpen}}" aria-label="Your city" onClick="{{locToggle}}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 13s-4.5-4.2-4.5-7.5a4.5 4.5 0 0 1 9 0C11.5 8.8 7 13 7 13z"></path><circle cx="7" cy="5.5" r="1.6"></circle></svg>
          <span>{{city}}</span>
          <svg class="vl-loc-chev" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5l3 3 3-3"></path></svg>
        </button>
        <ul class="{{locClass}}" role="listbox" aria-label="Choose your city">
          <sc-for list="{{cities}}" as="c" hint-placeholder-count="8">
            <li><button type="button" role="option" aria-selected="{{c.sel}}" onClick="{{c.pick}}">{{c.name}}<span>{{c.country}}</span></button></li>
          </sc-for>
        </ul>
      </div>
      <a href="#fleet" class="vl-btn vl-btn-dark vl-hd-cta" style="display: inline-flex; align-items: center; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 500; text-decoration: none; background: #121212; color: #ffffff; border: 1px solid #121212">Select a car</a>
      <button type="button" class="vl-burger" aria-label="Menu" aria-expanded="{{menuOpen}}" onClick="{{menuToggle}}"><span></span><span></span></button>
    </div>
  </header>
  <div class="{{menuClass}}" aria-hidden="{{menuHidden}}">
    <nav aria-label="Mobile">
      <a href="#what-we-do" onClick="{{menuClose}}">What we do</a>
      <a href="#services" onClick="{{menuClose}}">Services</a>
      <a href="#video" onClick="{{menuClose}}">Get 20% off</a>
      <a href="#fleet" onClick="{{menuClose}}">Our fleet</a>
      <a href="#reviews" onClick="{{menuClose}}">Reviews</a>
    </nav>
    <div>
      <p class="vl-mm-label">Your city</p>
      <div class="vl-mm-chips">
        <sc-for list="{{cities}}" as="c" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{c.sel}}" onClick="{{c.pick}}">{{c.name}}</button>
        </sc-for>
      </div>
    </div>
    <a href="#fleet" class="vl-btn vl-btn-dark vl-mm-cta" onClick="{{menuClose}}">Select a car <span class="vl-arr">→</span></a>
  </div>

<section ref="{{setHero}}" style="position: relative; overflow: hidden; height: clamp(680px, 100vh, 960px); container-type: size; background: #ffffff; color: #121212; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">

  <div aria-hidden="true" style="{{bandStyle}}">
    <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="5">
      <div class="ohm-tile" style="{{tile.style}}" onAnimationIteration="{{tile.onIter}}">
        <sc-for list="{{tile.slices}}" as="slice" hint-placeholder-count="16">
          <div style="{{slice.style}}"><img src="{{slice.src}}" alt="" draggable="false" style="{{slice.imgStyle}}"></div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: calc(78px + 2.5cqh) 16px 10cqh; gap: 0px">
    <div style="pointer-events: auto">
      <div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 0px"><div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; justify-content: normal; align-items: normal"><p style="margin: 0 0 22px; font-weight: 500; font-size: clamp(13px, 1.2cqw, 17.5px); line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #121212">CAR RENTAL IN EUROPE</p><h1 style="margin: 0; font-weight: 500; font-size: clamp(44px, min(6.4cqw, 10.2cqh), 92px); line-height: 0.85; letter-spacing: -0.06em; color: #121212; text-wrap: balance">Drive electric.<br><span style="color: #5f6366">Pay less.</span></h1></div></div>
      
    </div>
    <div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 0px; justify-content: space-between; align-items: center"><div style="pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 30px">
      <p style="margin: 0; max-width: 34ch; font-weight: 400; font-size: clamp(17px, 1.52cqw, 21.9px); line-height: 1.3; letter-spacing: -0.005em; color: #5f6366; text-wrap: balance">Charging included.</p>
      <div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; justify-content: normal; align-items: center"><div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center">
        <a href="#fleet" class="vl-btn vl-btn-dark" style="display: inline-flex; align-items: center; gap: 8px; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 500; text-decoration: none; background: #121212; color: #ffffff; border: 1px solid #121212">Select a car <span class="vl-arr">→</span></a>
        <a href="#what-we-do" class="vl-btn vl-btn-light" style="display: inline-flex; align-items: center; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 500; text-decoration: none; background: #ffffff; color: #121212; border: 1px solid #e7e8e6">How it works</a>
      </div></div>
      
    </div></div>
  </div>
</section>

<section id="what-we-do" style="background: #F2F2F2; color: #121212; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: clamp(96px, 11vw, 160px) clamp(16px, 6vw, 96px) clamp(64px, 7vw, 96px); height: 747px">
  <div class="ohm-b2-head" style="display: grid; grid-template-columns: 3fr 7fr; gap: 24px; align-items: start">
    <p style="margin: 0; padding-top: 12px; font-weight: 500; font-size: 13px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #5f6366">What we do</p>
    <h2 style="margin: 0; max-width: 17em; font-weight: 500; font-size: clamp(30px, 3.9vw, 56px); line-height: 1.04; letter-spacing: -0.035em; color: #121212; text-wrap: balance">Electric cars for the way you live, work and travel. Booked in minutes, charged and ready when you arrive.</h2>
  </div>
  <div class="ohm-b2-grid" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: clamp(80px, 13vw, 190px)">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #121212">Step in</figcaption>
      <img src="assets/img/what-we-do-1.jpg" alt="Model 3 interior with the steering wheel and centre touchscreen" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px">
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #121212">Tap to drive</figcaption>
      <img src="assets/img/what-we-do-2.jpg" alt="Driver's hand on the wheel with navigation on the touchscreen" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px">
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #121212">Charge on the way</figcaption>
      <img src="assets/img/what-we-do-3.jpg" alt="Black electric car parked by a fast charger in the rain" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px">
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #121212">Zero emissions</figcaption>
      <img src="assets/img/what-we-do-4.jpg" alt="Charging cable plugged into an electric car" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px">
    </figure>
  </div>
</section>

<section id="services" ref="{{setDrive}}" style="position: relative; height: 2900px; background: #F2F2F2; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="position: sticky; top: max(0px, calc(100vh - clamp(120px, 11vw, 190px) - clamp(420px, 58vh, 640px))); overflow: hidden; display: flex; flex-direction: column">
    <div style="position: relative; flex: 0 0 auto; height: clamp(120px, 11vw, 190px); background: #F2F2F2">
      <div ref="{{setCar}}" style="position: absolute; left: 0; bottom: -6px; z-index: 2; width: clamp(260px, 30vw, 520px); will-change: transform">
        <img src="assets/img/car-side.webp" alt="White electric sedan driving across the page" style="display: block; width: 100%; height: auto">
        <img ref="{{setWheelR}}" src="assets/img/wheel.webp" alt="" style="position: absolute; left: 11.843%; top: 48.16%; width: 15.632%; aspect-ratio: 1 / 1; will-change: transform">
        <img ref="{{setWheelF}}" src="assets/img/wheel.webp" alt="" style="position: absolute; left: 74.783%; top: 48.16%; width: 15.632%; aspect-ratio: 1 / 1; will-change: transform">
      </div>
    </div>
    <div style="position: relative; flex: 0 0 auto; height: clamp(420px, 58vh, 640px); overflow: hidden; background: #121212; color: #FFFFFF">
      <div ref="{{setTrack}}" style="display: flex; height: 100%; width: max-content; will-change: transform">
        <div class="ohm-drive-intro" style="box-sizing: border-box; flex: 0 0 auto; width: 100vw; padding: clamp(40px, 7vh, 80px) clamp(16px, 6vw, 96px); display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-content: stretch">
          <div style="display: flex; flex-direction: column; align-items: flex-start; min-height: 0">
            <p style="margin: 0 0 24px; font-weight: 500; font-size: 13px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #8d9094">Our services</p>
            <h2 style="margin: 0; max-width: 11em; font-weight: 500; font-size: clamp(36px, 4.6vw, 72px); line-height: 0.95; letter-spacing: -0.045em; color: #FFFFFF; text-wrap: balance">Everything you need to go electric. In one app.</h2>
            <a href="#fleet" class="vl-btn vl-btn-ghost" style="display: inline-flex; align-items: center; gap: 8px; margin-top: auto; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 500; text-decoration: none; color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.28)">Explore services <span class="vl-arr">→</span></a>
          </div>
          <div style="display: flex; flex-direction: column; gap: 16px; padding-top: 41px; max-width: 32em">
            <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #a3a6a8">From a weekend in the city to a month on the road, every trip comes with a fully charged, freshly cleaned Tesla.</p>
            <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #a3a6a8">One account, one price, no paperwork. Book, unlock and return your car from your phone, anywhere we operate.</p>
            <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #a3a6a8">Pick a Model 3 for the city or a Model Y for the family, switch cars between trips, and see the full price before you confirm. No fuel bills and no surprise fees when you return the car.</p>
            <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #a3a6a8">Every car is checked, cleaned and charged between rentals, and our support team is on call around the clock in every city we serve.</p>
          </div>
        </div>
        <div style="box-sizing: border-box; display: flex; gap: 12px; flex: 0 0 auto; height: 100%; padding: clamp(40px, 7vh, 80px) clamp(16px, 6vw, 96px) clamp(28px, 5vh, 56px) 0">
          <article class="vl-card vl-c1" tabindex="0">
            <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="9" width="32" height="29" rx="4"></rect><path d="M6 17h32M14 5v7M30 5v7"></path><rect class="ic-pop" x="24" y="24" width="7" height="7" rx="1.5"></rect></svg>
            <div>
              <h3 style="margin: 0; font-weight: 500; font-size: 26px; line-height: 1.05; letter-spacing: -0.03em">Daily rental</h3>
              <div class="vl-desc"><p style="margin: 0; padding-top: 14px; font-size: 15px; line-height: 1.45">Book by the day or by the hour. Pick up in minutes, return when you're done.</p></div>
            </div>
          </article>
          <article class="vl-card vl-c2" tabindex="0">
            <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ic-spin"><path d="M36 22a14 14 0 0 1-24.2 9.6M8 22a14 14 0 0 1 24.2-9.6"></path><path d="M32.6 6.6v6h-6M11.4 37.4v-6h6"></path></g></svg>
            <div>
              <h3 style="margin: 0; font-weight: 500; font-size: 26px; line-height: 1.05; letter-spacing: -0.03em">Monthly subscription</h3>
              <div class="vl-desc"><p style="margin: 0; padding-top: 14px; font-size: 15px; line-height: 1.45">One monthly fee covers the car, insurance and maintenance. Cancel any time.</p></div>
            </div>
          </article>
          <article class="vl-card vl-c3" tabindex="0">

<section id="video" style="position: relative; background: #FFFFFF; padding: clamp(64px, 8vw, 120px) clamp(16px, 6vw, 96px); font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="position: relative; overflow: hidden; isolation: isolate; height: clamp(560px, 86vh, 860px); border-radius: 16px; background: #121212; color: #FFFFFF">
    <video ref="{{setVideo}}" src="assets/video/offer.mp4" poster="assets/video/offer-poster.jpg" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-hidden="true" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover"></video>
    <div class="vl-video-shade" style="position: absolute; inset: 0; pointer-events: none"><div class="vl-video-copy" style="position: absolute; left: clamp(28px, 3.4vw, 56px); top: auto; bottom: clamp(28px, 3.4vw, 56px); width: 491px; pointer-events: auto">
      <span style="display: inline-block; margin-bottom: 20px; border-radius: 999px; padding: 6px 12px; background: #FFFFFF; color: #121212; font-weight: 500; font-size: 12px; line-height: 1.2; letter-spacing: 0.0625em; text-transform: uppercase">LIMITED OFFER −20%</span>
      <h2 style="margin: 0; font-weight: 500; font-size: clamp(32px, 3.6vw, 52px); line-height: 1; letter-spacing: -0.04em; color: #FFFFFF; text-wrap: balance; width: 598px">Book now. Get 20% off.</h2>
      
      <p style="margin: 16px 0 0; font-size: 16px; line-height: 1.5; color: rgba(255, 255, 255, 0.8); width: 408px">Room for five and their luggage, Autopark and charging included. Book before the timer runs out and save 20% on your first rental.</p>
      <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 28px">
        <a href="#fleet" class="vl-btn vl-btn-white" style="display: inline-flex; align-items: center; gap: 8px; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 500; text-decoration: none; color: #121212; background: #FFFFFF">Get 20% off <span class="vl-arr">→</span></a>
        <span style="display: inline-flex; align-items: baseline; gap: 8px; color: #FFFFFF"><span style="font-weight: 500; font-size: 32px; letter-spacing: -0.02em">{{offerNew}}</span><span style="font-size: 15px; color: rgba(255, 255, 255, 0.7)">/ day</span></span>
      </div>
      
    </div></div>
    
    
    
    
    <div style="position: absolute; top: clamp(28px, 3vw, 44px); left: clamp(28px, 3.4vw, 56px); right: clamp(28px, 3.4vw, 56px); display: flex; justify-content: space-between; gap: 24px; font-weight: 500; font-size: 13px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: rgba(255, 255, 255, 0.88)"><span>Velto · Model 3 offer</span>
      <span class="vl-video-end">Offer ends in <span ref="{{setTimecode}}" style="font-variant-numeric: tabular-nums">00:00:00</span></span>
    </div>
    
  </div>
</section>

<section id="fleet" style="position: relative; background: #FFFFFF; color: #121212; padding: clamp(24px, 3vw, 40px) 0 clamp(96px, 11vw, 160px); scroll-margin-top: 72px; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding: 0 clamp(16px, 6vw, 96px); margin-bottom: clamp(24px, 3vw, 40px)">
    <div>
      <p style="margin: 0 0 16px; font-weight: 500; font-size: 13px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #5f6366">Our fleet</p>
      <h2 style="margin: 0; font-weight: 500; font-size: clamp(32px, 3.9vw, 56px); line-height: 1; letter-spacing: -0.045em; text-wrap: balance">Pick your Tesla. Book in two minutes.</h2>
    </div>
    <span style="flex: 0 0 auto; font-size: 18px; color: #5f6366">{{fleetCount}} cars available in {{city}}</span>
  </div>
  <div class="vl-fleet-grid" style="padding: 0 clamp(16px, 6vw, 96px)">
    <sc-for list="{{fleet}}" as="car" hint-placeholder-count="6">
      <article class="vl-car" style="padding-top: 0px; padding-right: 0px; padding-bottom: 0px; padding-left: 0px; display: flex; gap: 0px">
        <img class="vl-car-img" src="{{car.img}}" alt="{{car.alt}}" loading="lazy" draggable="false" style="{{car.imgStyle}}">
        <div class="vl-car-top">
          <div>
            <div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 5px"><h3 style="font-size: 32px">{{car.name}}</h3><p class="vl-car-trim" style="font-size: 18px">{{car.trim}}</p></div>
            
          </div>
          <span class="vl-car-spec" style="font-size: 18px; font-weight: 400">{{car.away}}</span>
        </div>
        <div class="vl-car-bottom">
          <p class="vl-car-price" style="font-size: 44px">{{car.price}}<span class="vl-car-per">/ day</span></p>
          <button type="button" class="vl-car-book" onClick="{{car.onBook}}">Book now <span class="vl-arr">→</span></button>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section id="reviews" style="position: relative; background: #FFFFFF; color: #121212; padding: 0 clamp(16px, 6vw, 96px) clamp(96px, 11vw, 160px); font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="margin-bottom: clamp(24px, 3vw, 40px)">
    <p style="margin: 0 0 16px; font-weight: 500; font-size: 13px; line-height: 1.3; letter-spacing: 0.0625em; text-transform: uppercase; color: #5f6366">Reviews</p>
    <h2 style="margin: 0; font-weight: 500; font-size: clamp(32px, 3.9vw, 56px); line-height: 1; letter-spacing: -0.045em; text-wrap: balance">A few words from our drivers</h2>
  </div>
  <div class="vl-rev-grid">
    <article class="vl-rev" style="background: #F2F2F2">
      <div class="vl-rev-top">
        <div class="vl-rev-photo" style="background: #e7e8e6"><img src="assets/img/review-marta.jpg" alt="Marta Kowalski" loading="lazy"></div>
        <div>
          <p class="vl-rev-name">Marta Kowalski</p>
          <p class="vl-rev-role">Model Y · 14 days · Berlin</p>
        </div>
        <p class="vl-rev-text">I needed a car for a two-week work trip. I booked it in the app late in the evening, and by eight the next morning it was parked a few minutes' walk from my hotel, fully charged. Charging was included, so there were no fuel stops and no receipts to keep. I returned it at the airport with a third of the battery left and nobody asked a thing.</p>
      </div>
      <p class="vl-rev-quote">“Booked at night, driving by eight. The easiest rental I’ve ever had.”</p>
    </article>
    <article class="vl-rev" style="background: #F2F2F2">
      <div class="vl-rev-top">
        <div class="vl-rev-photo" style="background: #e7e8e6"><img src="assets/img/review-daniel.jpg" alt="Daniel Reyes" loading="lazy"></div>
        <div>
          <p class="vl-rev-name">Daniel Reyes</p>
          <p class="vl-rev-role">Model S · 4 days · Amsterdam</p>
        </div>
        <p class="vl-rev-text">We took the Model S out to the coast for a long weekend. The car was delivered to our door, the walkthrough took two minutes on my phone, and the car showed us exactly where to charge along the way. The price I saw when I booked was the price I paid, to the cent.</p>
      </div>
      <p class="vl-rev-quote">“It felt like owning a Tesla for a weekend, without the paperwork.”</p>
    </article>
  </div>
</section>

<div class="{{bkClass}}" role="dialog" aria-modal="true" aria-labelledby="vl-bk-title" aria-hidden="{{bkHidden}}" style="position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 16px; color: #121212; font-family: Aspekta, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
  <div class="vl-bk-frost" onClick="{{bkClose}}"></div>
  <div class="vl-bk-panel">
    <button type="button" class="vl-bk-x" aria-label="Close" onClick="{{bkClose}}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"></path></svg></button>
    <div class="vl-bk-car">
      <div class="vl-bk-thumb" style="{{bk.thumbStyle}}"><img src="{{bk.img}}" alt="" style="{{bk.imgStyle}}"></div>
      <div>
        <p class="vl-bk-eyebrow">Your car</p>
        <h3 id="vl-bk-title">{{bk.name}}</h3>
        <p class="vl-bk-sub">{{bk.trim}}</p>
      </div>
    </div>
    <form class="vl-bk-form" onSubmit="{{bkSubmit}}" style="{{bkFormStyle}}">
      <div class="vl-bk-row">
        <div>
          <p class="vl-bk-label">Rental days</p>
          <p class="vl-bk-hint">{{bk.range}}</p>
        </div>
        <div class="vl-bk-step">
          <button type="button" aria-label="Fewer days" onClick="{{bkLess}}">−</button>
          <span aria-live="polite">{{bk.days}}</span>
          <button type="button" aria-label="More days" onClick="{{bkMore}}">+</button>
        </div>
      </div>
      <label class="vl-bk-field"><span class="vl-bk-label">Pick-up date</span><input type="date" name="date" required value="{{bk.date}}" min="{{bk.min}}" onChange="{{bkDate}}"></label>
      <div>
        <p class="vl-bk-label">Pick-up</p>
        <div class="vl-bk-seg">
          <button type="button" aria-pressed="{{bk.selfPressed}}" onClick="{{bkSelf}}">Collect it · {{bk.away}}</button>
          <button type="button" aria-pressed="{{bk.delPressed}}" onClick="{{bkDeliver}}">Deliver to my address · +{{bk.delFee}}</button>
        </div>
      </div>
      <div>
        <p class="vl-bk-label">Extras</p>
        <div class="vl-bk-extras">
          <button type="button" aria-pressed="{{bk.seatPressed}}" onClick="{{bkSeat}}">Child seat · +{{bk.seatFee}} / day</button>
          <button type="button" aria-pressed="{{bk.drvPressed}}" onClick="{{bkDriver}}">Extra driver · +{{bk.drvFee}} / day</button>
        </div>
      </div>
      <div class="vl-bk-grid">
        <label class="vl-bk-field vl-bk-full"><span class="vl-bk-label">Full name</span><input type="text" name="name" autocomplete="name" required placeholder="Alex Morgan"></label>
        <label class="vl-bk-field"><span class="vl-bk-label">Email</span><input type="email" name="email" autocomplete="email" required placeholder="alex@mail.com"></label>
        <label class="vl-bk-field"><span class="vl-bk-label">Phone</span><input type="tel" name="tel" autocomplete="tel" required placeholder="+49 30 1234 5678"></label>
      </div>
      <div class="vl-bk-sum">
        <div style="display: flex"><span>{{bk.price}} × {{bk.days}} {{bk.dayWord}}</span><span>{{bk.base}}</span></div>
        <div style="{{bk.delRow}}"><span>Delivery</span><span>{{bk.delFee}}</span></div>
        <div style="{{bk.seatRow}}"><span>Child seat</span><span>{{bk.seatTotal}}</span></div>
        <div style="{{bk.drvRow}}"><span>Extra driver</span><span>{{bk.drvTotal}}</span></div>
        <div style="display: flex"><span>Charging</span><span>Included</span></div>
        <div class="vl-bk-total" style="display: flex"><span>Total</span><strong>{{bk.total}}</strong></div>
      </div>
      <button type="submit" class="vl-btn vl-btn-dark vl-bk-submit">Book now <span class="vl-arr">→</span></button>
      <p class="vl-bk-note">Free cancellation up to 24 hours before pick-up. You pay nothing until you collect the car.</p>
    </form>
    <div class="vl-bk-done" style="{{bkDoneStyle}}">
      <div class="vl-bk-check"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5l4.5 4.5L18 6.5"></path></svg></div>
      <h3>You're booked in.</h3>
      <p>We've sent the details for your {{bk.name}} to your email. Pick-up on {{bk.dateLong}}.</p>
      <button type="button" class="vl-btn vl-btn-dark vl-bk-submit" onClick="{{bkClose}}">Done</button>
    </div>
  </div>
</div>
</div>
</template>
